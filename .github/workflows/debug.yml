name: Build Termux APKs (compileSdk 36)

on:
  workflow_dispatch:
  release:
    types:
      - published

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package_variant: [ apt-android-7, apt-android-5 ]
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'release' && env.GITHUB_REF || '' }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      # ===== 安装 SDK 平台（包含 API 36） =====
      - run: |
          sdkmanager \
            "platforms;android-24" \
            "platforms;android-28" \
            "platforms;android-32" \
            "platforms;android-34" \
            "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            --sdk_root=$ANDROID_SDK_ROOT

      # ===== NDK r29 =====
      - run: |
          curl -fsSL -o /tmp/ndk.zip https://googledownloads.cn/android/repository/android-ndk-r29-linux.zip
          unzip -q /tmp/ndk.zip -d /tmp
          mv /tmp/android-ndk-r29 /tmp/ndk-r29
          REV=$(grep "Pkg.Revision" /tmp/ndk-r29/source.properties | cut -d= -f2 | tr -d ' ')
          echo "ANDROID_NDK_HOME=/tmp/ndk-r29" >> "$GITHUB_ENV"
          echo "JITPACK_NDK_VERSION=$REV" >> "$GITHUB_ENV"
          echo "ndk.dir=/tmp/ndk-r29" >> local.properties
          echo "sdk.dir=$ANDROID_SDK_ROOT" >> local.properties
          rm -f /tmp/ndk.zip

      # ===== Debug 签名 =====
      - name: Generate debug keystore
        run: |
          keytool -genkey -v \
            -keystore debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

      # ===== 配置 SDK 版本 + extractNativeLibs =====
      - name: Configure SDK and manifest
        run: |
          cp gradle.properties gradle.properties.bak

          # ===== compileSdk=36, targetSdk=32 =====
          sed -i 's/^compileSdkVersion=.*/compileSdkVersion=36/' gradle.properties
          sed -i 's/^targetSdkVersion=.*/targetSdkVersion=32/' gradle.properties

          # ===== AndroidManifest 配置 =====
          MANIFEST="app/src/main/AndroidManifest.xml"

          # 清理旧属性
          sed -i 's/android:extractNativeLibs="[^"]*"//g' "$MANIFEST"
          sed -i 's/android:preserveLegacyExternalStorage="[^"]*"//g' "$MANIFEST"

          # 插入新属性
          sed -i 's/<application/<application\n        android:extractNativeLibs="true"\n        android:preserveLegacyExternalStorage="true"/g' "$MANIFEST"

          echo "===== AndroidManifest application 标签 ====="
          grep -A 5 '<application' "$MANIFEST"

          echo "===== SDK 配置 ====="
          grep -E 'compileSdk|targetSdk|minSdk' gradle.properties

      # ===== Legacy packaging =====
      - run: |
          grep -q 'useLegacyPackaging' gradle.properties || \
          echo 'android.bundle.nativeLibs.useLegacyPackaging=true' >> gradle.properties

      # ===== 构建 =====
      - name: Build APKs
        shell: bash {0}
        env:
          PACKAGE_VARIANT: ${{ matrix.package_variant }}
          KEY_ALIAS: androiddebugkey
          KEY_PASSWORD: android
          STORE_PASSWORD: android
        run: |
          export TERMUX_PACKAGE_VARIANT="$PACKAGE_VARIANT"
          cp debug.keystore phone.jks

          # 下载 bootstrap
          ./gradlew :app:downloadBootstraps

          # 构建
          ./gradlew assembleDebug

          cd app/build/outputs/apk/debug

          # ===== 签名验证 =====
          for apk in *.apk; do
            $ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner verify "$apk" || \
            $ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner sign \
              --ks "$GITHUB_WORKSPACE/debug.keystore" \
              --ks-key-alias androiddebugkey \
              --ks-pass pass:android \
              --key-pass pass:android \
              "$apk"
          done

          # ===== 重命名 =====
          for f in *.apk; do
            abi="${f##*_}"; abi="${abi%.apk}"
            mv "$f" "termux-${abi}.apk"
          done

          sha256sum *.apk > sha256sums.txt

          echo "===== 最终文件 ====="
          ls -lh

      # ===== 上传 =====
      - uses: actions/upload-artifact@v4
        with:
          name: termux-${{ matrix.package_variant }}
          path: app/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: sha256-${{ matrix.package_variant }}
          path: app/build/outputs/apk/debug/*sha256sums*

      # ===== Release 上传 =====
      - if: github.event_name == 'release'
        run: |
          APK=app/build/outputs/apk/debug
          hub release edit -m "" \
            -a "$APK/termux-universal.apk" \
            -a "$APK/termux-arm64-v8a.apk" \
            -a "$APK/termux-armeabi-v7a.apk" \
            -a "$APK/termux-x86_64.apk" \
            -a "$APK/termux-x86.apk" \
            -a "$APK/sha256sums.txt" \
            "${GITHUB_REF/refs\/tags\//}"

      - if: always()
        run: mv gradle.properties.bak gradle.properties 2>/dev/null || true