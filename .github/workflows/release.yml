name: Build API32 Release APKs

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag name or leave empty'
        required: false
        default: ''
  release:
    types:
      - published

jobs:
  attach-apks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package_variant:
          - apt-android-7
          - apt-android-5
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Clone repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'release' && env.GITHUB_REF || '' }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platforms
        run: |
          sdkmanager \
            "platforms;android-32" \
            "platforms;android-34" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            --sdk_root=$ANDROID_SDK_ROOT

      - name: Download NDK r29
        run: |
          NDK_ZIP="android-ndk-r29-linux.zip"
          NDK_URL="https://googledownloads.cn/android/repository/${NDK_ZIP}"
          NDK_DIR="${{ runner.temp }}/ndk-r29"
          curl -fsSL -o "${{ runner.temp }}/${NDK_ZIP}" "$NDK_URL"
          unzip -q "${{ runner.temp }}/${NDK_ZIP}" -d "${{ runner.temp }}"
          mv "${{ runner.temp }}/android-ndk-r29" "$NDK_DIR"
          NDK_REVISION=$(grep "Pkg.Revision" "$NDK_DIR/source.properties" | cut -d'=' -f2 | tr -d ' ')
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "JITPACK_NDK_VERSION=$NDK_REVISION" >> "$GITHUB_ENV"
          echo "ndk.dir=$NDK_DIR" >> local.properties
          echo "sdk.dir=$ANDROID_SDK_ROOT" >> local.properties
          rm -f "${{ runner.temp }}/${NDK_ZIP}"

      - name: Decode signing keystore
        env:
          PHONE_JKS_BASE64: ${{ secrets.PHONE_JKS_BASE64 }}
        if: env.PHONE_JKS_BASE64 != ''
        run: echo "$PHONE_JKS_BASE64" | base64 -d > phone.jks

      - name: Create dummy keystore if missing
        run: |
          if [ ! -f phone.jks ]; then
            keytool -genkey -v -keystore phone.jks \
              -alias phone1 -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass 123456 -keypass 654321 \
              -dname "CN=Termux, OU=Dev, O=ZeroTermux, L=Unknown, ST=Unknown, C=CN"
          fi

      - name: Override SDK versions in gradle.properties
        run: |
          cp gradle.properties gradle.properties.bak
          for prop in "compileSdkVersion=35" "targetSdkVersion=28"; do   # ← 改为 targetSdkVersion=28
            key="${prop%%=*}"
            value="${prop#*=}"
            if grep -q "^${key}=" gradle.properties; then
              sed -i "s/^${key}=.*/${key}=${value}/" gradle.properties
            else
              echo "${key}=${value}" >> gradle.properties
            fi
          done
          grep -E "compileSdk|targetSdk" gradle.properties

      - name: Build release APKs
        shell: bash {0}
        env:
          PACKAGE_VARIANT: ${{ matrix.package_variant }}
          TERMUX_SPLIT_APKS_FOR_RELEASE_BUILDS: '1'
          KEY_ALIAS: 'phone1'
          KEY_PASSWORD: '654321'
          STORE_PASSWORD: '123456'
          TERMUX_APK_VERSION_TAG: 'release'
        run: |
          set -euo pipefail

          exit_on_error() {
              echo "❌ $1"
              if [ "${{ github.event_name }}" = "release" ]; then
                RELEASE_VERSION_NAME="${GITHUB_REF/refs\/tags\//}"
                hub release delete "$RELEASE_VERSION_NAME" 2>/dev/null || true
                git push --delete origin "$GITHUB_REF" 2>/dev/null || true
              fi
              exit 1
          }

          INPUT_TAG="${{ github.event.inputs.tag }}"
          RELEASE_VERSION_NAME="${INPUT_TAG:-manual-build-$(date +%Y%m%d%H%M%S)}"
          echo "Building RELEASE: $RELEASE_VERSION_NAME"
          export TERMUX_PACKAGE_VARIANT="${{ env.PACKAGE_VARIANT }}"

          echo "===== 环境 ====="
          echo "Java: $(java -version 2>&1 | head -1)"
          echo "NDK: $ANDROID_NDK_HOME ($JITPACK_NDK_VERSION)"
          grep -E "compileSdk|targetSdk" gradle.properties

          echo "===== 1️⃣ 下载 Bootstrap ====="
          ./gradlew :app:downloadBootstraps || exit_on_error "下载 bootstrap 失败"
          ls -lh app/src/main/cpp/bootstrap-*.zip

          echo "===== 2️⃣ 构建 Release (跳过 lint) ====="
          ./gradlew assembleRelease -x lintVitalRelease || exit_on_error "Release build failed"

          echo "===== 3️⃣ 重命名 APK ====="
          ORIG_DIR="$PWD"
          APK_DIR="${ORIG_DIR}/app/build/outputs/apk/release"
          cd "$APK_DIR"

          echo "原始文件:"
          ls -la

          for f in *.apk; do
            abi="${f##*_}"
            abi="${abi%.apk}"
            mv -v "$f" "termux-release-${abi}.apk"
          done

          echo "===== 最终文件 ====="
          ls -lh *.apk

          # 注意：sha256 计算移到签名之后，这里先不生成

      # ★ 新增：显式签名 APK
      - name: Sign APKs with apksigner
        shell: bash
        run: |
          APK_DIR="app/build/outputs/apk/release"
          BUILD_TOOLS="$ANDROID_SDK_ROOT/build-tools/35.0.0"
          echo "===== 开始签名 APK ====="
          for apk in "$APK_DIR"/*.apk; do
            filename=$(basename "$apk")
            signed="${apk%.apk}-signed.apk"
            echo "签名: $filename"
            "$BUILD_TOOLS/apksigner" sign \
              --ks phone.jks \
              --ks-pass pass:123456 \
              --key-pass pass:654321 \
              --ks-key-alias phone1 \
              --out "$signed" \
              "$apk"
            rm -f "$apk"
            mv "$signed" "$apk"
            echo "验证签名: $filename"
            "$BUILD_TOOLS/apksigner" verify --verbose "$apk"
          done
          echo "===== 签名完成 ====="

          # 重新生成 SHA256 校验文件
          cd "$APK_DIR"
          sha256sum *.apk > termux-release-sha256sums.txt
          echo "===== 新 SHA256 ====="
          cat termux-release-sha256sums.txt

      - name: Upload APKs as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: termux-api32-release-${{ matrix.package_variant }}
          path: app/build/outputs/apk/release/*.apk

      - name: Upload SHA256 as artifact
        uses: actions/upload-artifact@v4
        with:
          name: termux-api32-sha256-${{ matrix.package_variant }}
          path: app/build/outputs/apk/release/*sha256sums*

      - name: Attach APKs to release
        if: github.event_name == 'release'
        shell: bash {0}
        run: |
          RELEASE_VERSION_NAME="${GITHUB_REF/refs\/tags\//}"
          APK_DIR="${GITHUB_WORKSPACE}/app/build/outputs/apk/release"
          hub release edit \
            -m "" \
            -a "$APK_DIR/termux-release-universal.apk" \
            -a "$APK_DIR/termux-release-arm64-v8a.apk" \
            -a "$APK_DIR/termux-release-armeabi-v7a.apk" \
            -a "$APK_DIR/termux-release-x86_64.apk" \
            -a "$APK_DIR/termux-release-x86.apk" \
            -a "$APK_DIR/termux-release-sha256sums.txt" \
            "$RELEASE_VERSION_NAME"
          echo "✅ 已附加到 Release"

      - name: Restore gradle.properties
        if: always()
        run: |
          if [ -f gradle.properties.bak ]; then
            mv gradle.properties.bak gradle.properties
          fi