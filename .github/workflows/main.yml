name: Build API32 Debug APKs

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag name or leave empty for default branch'
        required: false
        default: ''
  release:
    types:
      - published

jobs:
  attach-apks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package_variant:
          - apt-android-7
          - apt-android-5
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Clone repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'release' && env.GITHUB_REF || '' }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # ===== 安装多个平台以满足依赖要求 =====
      - name: Install Android SDK platforms
        run: |
          sdkmanager \
            "platforms;android-32" \
            "platforms;android-34" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            --sdk_root=$ANDROID_SDK_ROOT

      - name: Download NDK r29
        run: |
          NDK_ZIP="android-ndk-r29-linux.zip"
          NDK_URL="https://googledownloads.cn/android/repository/${NDK_ZIP}"
          NDK_DIR="${{ runner.temp }}/ndk-r29"
          curl -fsSL -o "${{ runner.temp }}/${NDK_ZIP}" "$NDK_URL"
          unzip -q "${{ runner.temp }}/${NDK_ZIP}" -d "${{ runner.temp }}"
          mv "${{ runner.temp }}/android-ndk-r29" "$NDK_DIR"
          NDK_REVISION=$(grep "Pkg.Revision" "$NDK_DIR/source.properties" | cut -d'=' -f2 | tr -d ' ')
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "JITPACK_NDK_VERSION=$NDK_REVISION" >> "$GITHUB_ENV"
          echo "ndk.dir=$NDK_DIR" >> local.properties
          echo "sdk.dir=$ANDROID_SDK_ROOT" >> local.properties
          rm -f "${{ runner.temp }}/${NDK_ZIP}"

      # ===== 关键修复：compileSdk=34 满足依赖，targetSdk=32 =====
      - name: Override SDK versions in gradle.properties
        run: |
          cp gradle.properties gradle.properties.bak

          # compileSdk 设 34（满足依赖库要求），targetSdk 设 32（你想要的 API 32）
          for prop in "compileSdkVersion=34" "targetSdkVersion=32"; do
            key="${prop%%=*}"
            value="${prop#*=}"
            if grep -q "^${key}=" gradle.properties; then
              sed -i "s/^${key}=.*/${key}=${value}/" gradle.properties
              echo "✅ 更新: ${key}=${value}"
            else
              echo "${key}=${value}" >> gradle.properties
              echo "➕ 追加: ${key}=${value}"
            fi
          done

          echo "===== SDK 版本 ====="
          grep -E "compileSdk|targetSdk|minSdk" gradle.properties

      - name: Build and attach APKs
        shell: bash {0}
        env:
          PACKAGE_VARIANT: ${{ matrix.package_variant }}
        run: |
          exit_on_error() {
              echo "$1"
              if [ "${{ github.event_name }}" = "release" ]; then
                RELEASE_VERSION_NAME="${GITHUB_REF/refs\/tags\//}"
                hub release delete "$RELEASE_VERSION_NAME" 2>/dev/null || true
                git push --delete origin "$GITHUB_REF" 2>/dev/null || true
              fi
              exit 1
          }

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            INPUT_TAG="${{ github.event.inputs.tag }}"
            if [ -n "$INPUT_TAG" ]; then
              RELEASE_VERSION_NAME="$INPUT_TAG"
            else
              RELEASE_VERSION_NAME="manual-build-$(date +%Y%m%d%H%M%S)"
            fi
          else
            RELEASE_VERSION_NAME="${GITHUB_REF/refs\/tags\//}"
          fi

          echo "Building version name: $RELEASE_VERSION_NAME"

          APK_DIR_PATH="./app/build/outputs/apk/debug"
          APK_VERSION_TAG="$RELEASE_VERSION_NAME+${{ env.PACKAGE_VARIANT }}-github-debug"
          APK_BASENAME_PREFIX="termux-app_$APK_VERSION_TAG"

          export TERMUX_APK_VERSION_TAG="$APK_VERSION_TAG"
          export TERMUX_PACKAGE_VARIANT="${{ env.PACKAGE_VARIANT }}"

          echo "===== 环境 ====="
          echo "Java: $(java -version 2>&1 | head -1)"
          echo "Gradle: $(./gradlew --version 2>&1 | grep 'Gradle ' | head -1)"
          echo "NDK: $ANDROID_NDK_HOME ($JITPACK_NDK_VERSION)"
          grep -E "compileSdk|targetSdk" gradle.properties
          echo "Git ref: $(git rev-parse --short HEAD)"

          if ! ./gradlew assembleDebug; then
            exit_on_error "Build failed"
          fi

          echo "===== 验证 APK ====="
          for abi in universal arm64-v8a armeabi-v7a x86_64 x86; do
            if ! test -f "$APK_DIR_PATH/${APK_BASENAME_PREFIX}_$abi.apk"; then
              files_found="$(ls "$APK_DIR_PATH")"
              exit_on_error "Missing APK: $abi. Found: $files_found"
            fi
          done

          echo "===== SHA256 ====="
          cd "$APK_DIR_PATH"
          sha256sum \
            "${APK_BASENAME_PREFIX}_universal.apk" \
            "${APK_BASENAME_PREFIX}_arm64-v8a.apk" \
            "${APK_BASENAME_PREFIX}_armeabi-v7a.apk" \
            "${APK_BASENAME_PREFIX}_x86_64.apk" \
            "${APK_BASENAME_PREFIX}_x86.apk" \
            > "${APK_BASENAME_PREFIX}_sha256sums"

          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "===== 附加到 Release ====="
            hub release edit \
              -m "" \
              -a "$APK_DIR_PATH/${APK_BASENAME_PREFIX}_universal.apk" \
              -a "$APK_DIR_PATH/${APK_BASENAME_PREFIX}_arm64-v8a.apk" \
              -a "$APK_DIR_PATH/${APK_BASENAME_PREFIX}_armeabi-v7a.apk" \
              -a "$APK_DIR_PATH/${APK_BASENAME_PREFIX}_x86_64.apk" \
              -a "$APK_DIR_PATH/${APK_BASENAME_PREFIX}_x86.apk" \
              -a "$APK_DIR_PATH/${APK_BASENAME_PREFIX}_sha256sums" \
              "$RELEASE_VERSION_NAME"
          else
            echo "===== 手动触发：APK 已构建 ====="
            ls -lh "$APK_DIR_PATH"
          fi

      - name: Upload APKs as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: termux-api32-apks-${{ matrix.package_variant }}
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload SHA256 as artifact
        uses: actions/upload-artifact@v4
        with:
          name: termux-api32-sha256-${{ matrix.package_variant }}
          path: app/build/outputs/apk/debug/*sha256sums

      - name: Restore gradle.properties
        if: always()
        run: |
          if [ -f gradle.properties.bak ]; then
            mv gradle.properties.bak gradle.properties
          fi