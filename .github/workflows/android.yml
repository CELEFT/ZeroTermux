name: Build API32 Debug APKs

on:
  release:
    types:
      - published

jobs:
  attach-apks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package_variant:
          - apt-android-7
          - apt-android-5
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Clone repository
        uses: actions/checkout@v6
        with:
          ref: ${{ env.GITHUB_REF }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform 32
        run: |
          sdkmanager \
            "platforms;android-32" \
            "build-tools;33.0.2" \
            --sdk_root=$ANDROID_SDK_ROOT

      - name: Download NDK r29
        run: |
          NDK_ZIP="android-ndk-r29-linux.zip"
          NDK_URL="https://googledownloads.cn/android/repository/${NDK_ZIP}"
          NDK_DIR="${{ runner.temp }}/ndk-r29"
          curl -fsSL -o "${{ runner.temp }}/${NDK_ZIP}" "$NDK_URL"
          unzip -q "${{ runner.temp }}/${NDK_ZIP}" -d "${{ runner.temp }}"
          mv "${{ runner.temp }}/android-ndk-r29" "$NDK_DIR"
          NDK_REVISION=$(grep "Pkg.Revision" "$NDK_DIR/source.properties" | cut -d'=' -f2 | tr -d ' ')
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "JITPACK_NDK_VERSION=$NDK_REVISION" >> "$GITHUB_ENV"
          echo "ndk.dir=$NDK_DIR" >> local.properties
          echo "sdk.dir=$ANDROID_SDK_ROOT" >> local.properties
          rm -f "${{ runner.temp }}/${NDK_ZIP}"

      - name: Fix Gradle wrapper for AGP 8.13.2
        run: |
          chmod +x gradlew
          ./gradlew wrapper --gradle-version=8.13.2 --distribution-type=bin

      - name: Set gradle.properties to API 32
        run: |
          cp gradle.properties gradle.properties.bak
          cat > gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m
          org.gradle.parallel=true
          compileSdkVersion=32
          targetSdkVersion=32
          minSdkVersion=24
          android.useAndroidX=true
          EOF

      - name: Restore gradle.properties after build
        if: always()
        run: |
          if [ -f gradle.properties.bak ]; then
            mv gradle.properties.bak gradle.properties
          fi

      - name: Build and attach APKs
        shell: bash {0}
        env:
          PACKAGE_VARIANT: ${{ matrix.package_variant }}
        run: |
          exit_on_error() {
              echo "$1"
              hub release delete "$RELEASE_VERSION_NAME"
              git push --delete origin "$GITHUB_REF"
              exit 1
          }

          RELEASE_VERSION_NAME="${GITHUB_REF/refs\/tags\//}"

          APK_DIR_PATH="./app/build/outputs/apk/debug"
          APK_VERSION_TAG="$RELEASE_VERSION_NAME+${{ env.PACKAGE_VARIANT }}-github-debug"
          APK_BASENAME_PREFIX="termux-app_$APK_VERSION_TAG"

          export TERMUX_APK_VERSION_TAG="$APK_VERSION_TAG"
          export TERMUX_PACKAGE_VARIANT="${{ env.PACKAGE_VARIANT }}"

          echo "Java: $(java -version 2>&1 | head -1)"
          echo "NDK: $ANDROID_NDK_HOME"
          echo "SDK API: $(grep compileSdk gradle.properties)"

          if ! ./gradlew assembleDebug; then
            exit_on_error "Build failed"
          fi

          for abi in universal arm64-v8a armeabi-v7a x86_64 x86; do
            if ! test -f "$APK_DIR_PATH/${APK_BASENAME_PREFIX}_$abi.apk"; then
              files_found="$(ls "$APK_DIR_PATH")"
              exit_on_error "Missing APK: $abi. Found: $files_found"
            fi
          done

          cd "$APK_DIR_PATH"
          sha256sum \
            "${APK_BASENAME_PREFIX}_universal.apk" \
            "${APK_BASENAME_PREFIX}_arm64-v8a.apk" \
            "${APK_BASENAME_PREFIX}_armeabi-v7a.apk" \
            "${APK_BASENAME_PREFIX}_x86_64.apk" \
            "${APK_BASENAME_PREFIX}_x86.apk" \
            > "${APK_BASENAME_PREFIX}_sha256sums"

          hub release edit \
            -m "" \
            -a "$APK_DIR_PATH/${APK_BASENAME_PREFIX}_universal.apk" \
            -a "$APK_DIR_PATH/${APK_BASENAME_PREFIX}_arm64-v8a.apk" \
            -a "$APK_DIR_PATH/${APK_BASENAME_PREFIX}_armeabi-v7a.apk" \
            -a "$APK_DIR_PATH/${APK_BASENAME_PREFIX}_x86_64.apk" \
            -a "$APK_DIR_PATH/${APK_BASENAME_PREFIX}_x86.apk" \
            -a "$APK_DIR_PATH/${APK_BASENAME_PREFIX}_sha256sums" \
            "$RELEASE_VERSION_NAME"
